
<!DOCTYPE html>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>StudentHub</h1>
    <button id="menuToggle" class="menu-toggle" type="button"
            aria-label="Toggle navigation" aria-expanded="false">☰ Menu</button>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="admin.html">Admin</a></li>
        <li><a href="faq.html" aria-current="page">FAQ</a></li>
        <li><a href="feedback.html">Feedback</a></li>
      </ul>
    </nav>
    <button id="themeToggle" type="button">Switch to Dark Mode</button>
  </header>

  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="index.html">Home</a> &gt; FAQ
  </nav>

  <main id="main-content">
    <section>
      <h2>Frequently Asked Questions</h2>

      <label for="faqSearch">Search questions</label>
      <input type="search" id="faqSearch"
             placeholder="Search FAQs">

      <label for="faqCategory">Filter by category</label>
      <select id="faqCategory">
        <option value="">All categories</option>
        <option value="Account">Account</option>
        <option value="Events">Events</option>
        <option value="Profile">Profile</option>
        <option value="Support">Support</option>
        <option value="General">General</option>
      </select>

      <label for="faqSort">Sort by</label>
      <select id="faqSort">
        <option value="id-asc">Original order</option>
        <option value="question-asc">Question: A–Z</option>
        <option value="question-desc">Question: Z–A</option>
      </select>

      <p id="faqsStatus" role="status" aria-live="polite">
        Loading FAQs...
      </p>

      <div id="faqsList"></div>
      <div id="faqsPagination" class="pagination"></div>
    </section>
  </main>

  <footer>

  </footer>

  <script src="script.js"></script>
  <script src="data.js"></script>
