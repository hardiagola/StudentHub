
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events - StudentHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>StudentHub</h1>
    <button id="menuToggle" class="menu-toggle" type="button"
            aria-label="Toggle navigation" aria-expanded="false">☰ Menu</button>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="events.html" aria-current="page">Events</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="admin.html">Admin</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="feedback.html">Feedback</a></li>
      </ul>
    </nav>
    <button id="themeToggle" type="button">Switch to Dark Mode</button>
  </header>

  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="index.html">Home</a> &gt; Events
  </nav>

  <main id="main-content">
    <section>
      <h2>Upcoming Events</h2>

      <label for="eventSearch">Search events</label>
      <input type="search" id="eventSearch"
             placeholder="Search by event name or venue">

      <label for="eventCategory">Filter by category</label>
      <select id="eventCategory">
        <option value="">All categories</option>
        <option value="Technical">Technical</option>
        <option value="Cultural">Cultural</option>
        <option value="Workshop">Workshop</option>
        <option value="Sports">Sports</option>
      </select>

      <label for="eventSort">Sort by</label>
      <select id="eventSort">
        <option value="date-asc">Date: earliest first</option>
        <option value="date-desc">Date: latest first</option>
        <option value="name-asc">Name: A–Z</option>
        <option value="name-desc">Name: Z–A</option>
      </select>

      <p id="eventsStatus" role="status" aria-live="polite">Loading events...</p>
      <div id="eventsList" class="data-grid"></div>
      <div id="eventsPagination" class="pagination"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 StudentHub. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script src="data.js"></script>
</body>
</html>
